<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title"><title id="title">01 / Detrás del código. Luis Enrique González Ramírez, desarrollador en Toluca.</title><defs><radialGradient id="aurora"><stop stop-color="#8B5CF6" stop-opacity=".28"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient></defs><style>
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-36px,14px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(250px);opacity:0}}
