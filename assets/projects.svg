<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="145" viewBox="0 0 1000 145" role="img" aria-labelledby="title"><title id="title">02 / Proyectos con intención</title><style>
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-36px,14px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(250px);opacity:0}}
@keyframes cursor{0%,45%{opacity:1}55%,100%{opacity:.15}}
.drift{animation:drift 9s cubic-bezier(.77,0,.175,1) infinite}
.pulse{animation:pulse 4s cubic-bezier(.77,0,.175,1) infinite}
.flow{animation:flow 3s linear infinite}
.cursor{animation:cursor 1.8s linear infinite}
@media(prefers-reduced-motion:reduce){.drift,.flow{animation:none}.pulse,.cursor{animation:none;opacity:.7}}
</style><rect width="1000" height="145" rx="16" fill="#05070B"/><g font-family="Arial,Helvetica,sans-serif"><text x="30" y="38" font-size="16" fill="#3986FF" font-weight="700">02 / PROYECTOS CON INTENCIÓN</text><text x="30" y="98" font-size="40" fill="#F5F7FC" font-weight="700">Menos promesas. Más proyectos.</text><path d="M30 128h940" stroke="#263248"/></g><g><circle cx="858" cy="41" r="5" fill="#3986FF"/><circle cx="881" cy="41" r="5" fill="#22D3EE"/><circle cx="904" cy="41" r="5" fill="#A78BFA"/></g></svg>