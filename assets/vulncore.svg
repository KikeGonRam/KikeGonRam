<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="205" viewBox="0 0 1000 205" role="img" aria-labelledby="title"><title id="title">vulncore. Escáner de vulnerabilidades para servidores Linux.</title><style>
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-36px,14px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(250px);opacity:0}}
@keyframes cursor{0%,45%{opacity:1}55%,100%{opacity:.15}}
.drift{animation:drift 9s cubic-bezier(.77,0,.175,1) infinite}
.pulse{animation:pulse 4s cubic-bezier(.77,0,.175,1) infinite}
.flow{animation:flow 3s linear infinite}
.cursor{animation:cursor 1.8s linear infinite}
@media(prefers-reduced-motion:reduce){.drift,.flow{animation:none}.pulse,.cursor{animation:none;opacity:.7}}
