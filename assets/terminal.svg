<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d">
  <title id="t">01 / kike@dev — terminal con la mascota Byte</title>
  <desc id="d">whoami: Luis Enrique González Ramírez, desarrollador full-stack y DevOps. Trabajo en una plataforma de pagos y un portal corporativo; construyo UrbanBlade (web, API, Android e infraestructura en AWS); aprendo AWS, Terraform y redes (CCNA). Despliegue de UrbanBlade a staging: build, test, scan y ECS correctos.</desc>
  <style>
    @keyframes blink { 0%, 40%, 46%, 100% { transform: scaleY(1); } 43% { transform: scaleY(0.08); } }
    @keyframes wave { 0%, 60%, 100% { transform: rotate(0deg); } 68%, 84% { transform: rotate(-17deg); } 76%, 92% { transform: rotate(12deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes cursorPulse { 0%, 45% { opacity: 1; } 55%, 100% { opacity: 0.18; } }
    @keyframes ok { 0%, 10% { opacity: 0; } 18%, 100% { opacity: 1; } }
    .eyes { transform-origin: 830px 193px; animation: blink 6s linear infinite; }
    .paw { transform-origin: 895px 240px; animation: wave 8s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .bot { animation: bob 5s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .cursor { animation: cursorPulse 1.6s linear infinite; }
    .k { opacity: 0; animation: ok 7s linear infinite; }
    .k2 { animation-delay: .6s } .k3 { animation-delay: 1.2s } .k4 { animation-delay: 1.8s } .k5 { animation-delay: 2.4s }
    .mono { font-family: Consolas, "SFMono-Regular", Menlo, "Courier New", monospace; }
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) { .eyes, .paw, .bot, .cursor, .k { animation: none; opacity: 1; } }
  </style>
  <rect x="1" y="1" width="998" height="398" rx="16" fill="#080B12" stroke="#263248"/>
