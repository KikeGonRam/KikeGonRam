  <text x="113" y="33" class="mono" font-size="15" fill="#91A0B8">01 / detrás del código — kike@dev: ~</text>
  <text x="905" y="33" class="mono" font-size="13" fill="#38BDF8">zsh · main</text>

  <text x="36" y="92" class="mono" font-size="18" fill="#67E8F9">kike@dev:~$ whoami</text>
  <text x="36" y="136" class="sans" font-size="38" fill="#F8FAFC" font-weight="700">Luis Enrique González Ramírez</text>
  <text x="36" y="166" class="sans" font-size="19" fill="#D9E7FF">Full-stack &amp; DevOps · Ing. en Desarrollo y Gestión de Software</text>

  <g class="mono" font-size="15.5">
    <text x="36" y="206" fill="#38BDF8">trabajo</text><text x="140" y="206" fill="#E2E8F0">plataforma de pagos y portal corporativo en producción</text>
    <text x="36" y="234" fill="#38BDF8">construyo</text><text x="140" y="234" fill="#E2E8F0">UrbanBlade: web, API, Android e infra en AWS</text>
    <text x="36" y="262" fill="#38BDF8">aprendo</text><text x="140" y="262" fill="#E2E8F0">AWS · Terraform · redes (CCNA)</text>
  </g>

  <text x="36" y="306" class="mono" font-size="15.5" fill="#67E8F9">kike@dev:~$ ./deploy urbanblade --env staging</text>
  <g class="mono" font-size="15">
    <text x="36" y="334" class="k k1" fill="#28C840">✓ build</text>
    <text x="126" y="334" class="k k2" fill="#28C840">✓ test</text>
    <text x="208" y="334" class="k k3" fill="#28C840">✓ scan</text>
    <text x="290" y="334" class="k k4" fill="#28C840">✓ ecs</text>
    <text x="364" y="334" class="k k5" fill="#D9E7FF">→ urbanblade.com.mx</text>
  </g>
  <text x="36" y="370" class="mono" font-size="15.5" fill="#67E8F9">kike@dev:~$</text>
