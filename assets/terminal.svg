<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 385" width="1000" height="385" role="img" aria-labelledby="title">
  <title id="title">01 / terminal viva — kike@dev: ~</title>
  
  <style>
    @keyframes blink { 0%, 40%, 46%, 100% { transform: scaleY(1); } 43% { transform: scaleY(0.08); } }
    @keyframes wave { 0%, 60%, 100% { transform: rotate(0deg); } 68%, 84% { transform: rotate(-17deg); } 76%, 92% { transform: rotate(12deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes cursorPulse { 0%, 45% { opacity: 1; } 55%, 100% { opacity: 0.18; } }
    @keyframes lineGlow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    
    .eyes { transform-origin: 830px 193px; animation: blink 6s linear infinite; }
    .paw { transform-origin: 895px 240px; animation: wave 8s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .bot { animation: bob 5s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .cursor { animation: cursorPulse 1.6s linear infinite; }
    .neon-bar { animation: lineGlow 4s ease-in-out infinite; }
    
    .mono { font-family: "Consolas", "Courier New", monospace; }
    .sans { font-family: "Arial", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    
    @media(prefers-reduced-motion: reduce) {
      .eyes, .paw, .bot, .cursor, .neon-bar { animation: none; }
    }
  </style>

  <!-- Ventana Terminal con colores suaves y oscuros (sin filtros agresivos) -->
  <rect x="1" y="1" width="998" height="383" rx="16" fill="#080B12" stroke="#263248"/>
  <path d="M17 1h966q16 0 16 16v37H1V17Q1 1 17 1" fill="#151A24"/>
  <path d="M1 54h998" stroke="#263248"/>

  <!-- Botones de la Terminal -->
  <circle cx="27" cy="27" r="6" fill="#FF6058"/>
  <circle cx="49" cy="27" r="6" fill="#FEBC2E"/>
  <circle cx="71" cy="27" r="6" fill="#28C840"/>

  <text x="113" y="33" class="mono" font-size="15" fill="#91A0B8">01 / detrás del código — kike@dev: ~</text>
  <text x="915" y="33" class="mono" font-size="13" fill="#38BDF8">zsh:main</text>

  <!-- SECCIÓN IZQUIERDA: CONTENIDO LIMPIO, ELEGANTE Y LEGIBLE -->
  <!-- Command prompt -->
  <text x="36" y="93" class="mono" font-size="19" fill="#67E8F9">kike@dev:~$ whoami</text>

  <!-- Nombre y rol en tipografía limpia sin pixelado -->
  <text x="36" y="142" class="sans" font-size="44" fill="#F8FAFC" font-weight="700">Luis Enrique.</text>
  <text x="36" y="176" class="sans" font-size="21" fill="#D9E7FF">González Ramírez / Software developer</text>
  <text x="36" y="214" class="sans" font-size="21" fill="#A7B3C8">Interfaces, APIs y datos. Del código al producto.</text>

  <!-- Datos clave de la consola -->
  <text x="36" y="254" class="mono" font-size="16" fill="#38BDF8">location</text>
  <text x="145" y="254" class="mono" font-size="16" fill="#E2E8F0">Toluca, México</text>

  <text x="36" y="284" class="mono" font-size="16" fill="#38BDF8">focus   </text>
  <text x="145" y="284" class="mono" font-size="16" fill="#E2E8F0">Web · Móvil · Cloud &amp; IA local</text>

  <text x="36" y="314" class="mono" font-size="16" fill="#38BDF8">quote   </text>
  <text x="145" y="314" class="mono" font-size="16" fill="#67E8F9" font-weight="600">"Ideas claras. Código con carácter."</text>

  <!-- Footer comando -->
  <text x="36" y="352" class="mono" font-size="15" fill="#67E8F9">kike@dev:~$ ./hablemos --ahora</text>
  <rect x="330" y="338" width="8" height="17" fill="#67E8F9" class="cursor"/>

  <!-- Separador vertical sutil entre texto y mascota -->
  <line x1="695" y1="55" x2="695" y2="365" stroke="#1E293B" stroke-dasharray="3 3"/>

  <!-- SECCIÓN DERECHA: MASCOTA BYTE NATIVA Y LIMPIA -->
  <ellipse cx="830" cy="305" rx="93" ry="10" fill="#030509"/>
  <g class="bot">
    <!-- Cola / Cable -->
    <path d="M754 258q-65-20-46-67q12-26 30-9" stroke="#3986FF" stroke-width="13" fill="none" stroke-linecap="round"/>
    
    <!-- Cuerpo -->
    <rect x="775" y="226" width="111" height="67" rx="27" fill="#1769FF"/>
    <rect x="794" y="240" width="71" height="42" rx="16" fill="#102653"/>

    <!-- Orejas -->
    <path d="M765 166l3-58 45 35m34 0 47-35 3 61" fill="#1769FF" stroke="#6DA3FF" stroke-width="3"/>
    <path d="M779 145v-15l15 14m70 0 17-14v16" fill="#22D3EE"/>

    <!-- Cabeza -->
    <rect x="755" y="142" width="153" height="95" rx="34" fill="#1769FF" stroke="#6DA3FF" stroke-width="3"/>
    <rect x="768" y="158" width="127" height="61" rx="22" fill="#05070B"/>

    <!-- Ojos animados suaves -->
    <g class="eyes">
      <path d="M786 187q10-16 20 0m51 0q10-16 20 0" stroke="#67E8F9" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Sonrisa -->
    <path d="M823 200q9 10 18 0" stroke="#67E8F9" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Mejillas -->
    <circle cx="781" cy="202" r="4" fill="#A78BFA"/>
    <circle cx="881" cy="202" r="4" fill="#A78BFA"/>

    <!-- Patas -->
    <path d="M787 285v12m85-12v12" stroke="#6DA3FF" stroke-width="15" stroke-linecap="round"/>

    <!-- Pata saludando -->
    <g class="paw">
      <path d="M883 246l28-21" stroke="#1769FF" stroke-width="17" stroke-linecap="round"/>
      <circle cx="915" cy="218" r="15" fill="#3986FF"/>
      <circle cx="915" cy="218" r="5" fill="#67E8F9"/>
    </g>
  </g>

  <!-- Label de Byte -->
  <text x="748" y="348" class="mono" font-size="16" fill="#67E8F9" font-weight="600">~/byte — di hola</text>

  <!-- Línea inferior de neón suave -->
  <line x1="20" y1="383" x2="980" y2="383" stroke="#1769FF" stroke-width="2" class="neon-bar"/>
</svg>