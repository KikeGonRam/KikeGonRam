  .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
  .mono { font-family: Consolas, "SFMono-Regular", Menlo, "Courier New", monospace; }
  .flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -14; } }
  @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
</style>
