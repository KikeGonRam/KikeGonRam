<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d">
<title id="t">02 / UrbanBlade — arquitectura</title>
<desc id="d">UrbanBlade: plataforma para barberías. Clientes web (Nuxt 4, PWA) y Android (Kotlin, Jetpack Compose) entran por CloudFront a servicios en AWS ECS Fargate: frontend Nuxt, API Laravel 13, chatbot con Ollama y analítica con PySpark. Datos en MongoDB Atlas y Redis; pagos con Stripe. GitHub Actions construye y publica imágenes en ECR y despliega en ECS; Terraform define la infraestructura. Commits propios: 512 web, 370 API, 303 Android, 44 Terraform.</desc>
